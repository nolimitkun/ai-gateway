# Medium tier. Long context at a lower cost per token than the big tier, on
# H200. A `big` or `medium` token may reach it; `small` may not.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: vllm-deepseek-v4-flash
  namespace: ai-demo
  labels: {ai-gateway.openai/model-tier: medium}

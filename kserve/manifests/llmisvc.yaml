# CPU-only KServe LLMInferenceService fixture. KServe manages the two model
# replicas, their Service, the llm-d EPP, and the GAIE InferencePool. The model
# URI is descriptive only: storage initialization is deliberately disabled and
# the existing OpenAI-compatible Python mock is mounted as a custom runtime.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  model:
    uri: hf://local/kserve-mock
    name: mock-kserve
  storageInitializer:
    enabled: false
  replicas: 2
  template:
    containers:
      - name: main
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: [python3, /srv/server.py]
        env:
          - name: MODEL_NAME
            value: mock-kserve
          - name: UPSTREAM_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: LATENCY_MS
            value: "0"
          - name: PORT
            value: "8000"
        ports:
          - name: http
            containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            memory: 192Mi
        volumeMounts:
          - name: source
            mountPath: /srv
    volumes:
      - name: source
        configMap:
          name: mock-llm-src
  router:
    gateway:
      refs:
        - name: ai-gateway
          namespace: ai-demo
    route:
      http:
        refs:
          - name: kserve-mock
    scheduler:
      replicas: 1
      pool:
        spec:
          targetPorts:
            - number: 8000
          appProtocol: http
          selector:
            matchLabels:
              app.kubernetes.io/name: kserve-mock
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          endpointPickerRef:
            name: kserve-mock-epp-service
            port:
              number: 9002
            failureMode: FailOpen
      config:
        inline:
          apiVersion: llm-d.ai/v1alpha1
          kind: EndpointPickerConfig
          plugins:
            - type: passthrough-parser
            - type: active-request-scorer
            - type: session-affinity-scorer
          requestHandler:
            parsers:
              - pluginRef: passthrough-parser
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: active-request-scorer
                  weight: 1
                - pluginRef: session-affinity-scorer
                  weight: 1
      template:
        containers:
          - name: main
            image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --pool-name
              - kserve-mock-inference-pool
              - --pool-namespace
              - ai-demo
              - --pool-group
              - inference.networking.k8s.io
              - --zap-encoder
              - json
              - --grpc-port
              - "9002"
              - --grpc-health-port
              - "9003"
              - --cert-path
              - /var/run/kserve/tls
              - --metrics-endpoint-auth=false
              - --tracing=false
            ports:
              - name: grpc
                containerPort: 9002
              - name: grpc-health
                containerPort: 9003
              - name: metrics
                containerPort: 9090
              - name: zmq
                containerPort: 5557
            livenessProbe:
              grpc:
                port: 9003
                service: inference-extension
              initialDelaySeconds: 5
              periodSeconds: 10
            readinessProbe:
              grpc:
                port: 9003
                service: inference-extension
              periodSeconds: 2
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
            volumeMounts:
              - name: tls-certs
                mountPath: /var/run/kserve/tls
                readOnly: true
        volumes:
          - name: tls-certs
            secret:
              secretName: kserve-mock-kserve-self-signed-certs

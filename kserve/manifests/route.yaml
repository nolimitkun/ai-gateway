# Identical bring-your-own route referenced by the LLMInferenceService in all
# clusters. KServe owns the InferencePool and EPP; this repository owns the
# route so the gateway comparison uses exactly the same matching semantics.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  rules:
    # The exact chat rule is named so gateways with route-scoped extension
    # policies can attach semantic routing without sending embeddings,
    # reranking, model-catalog, or audio requests through a chat-only ext_proc
    # server. The /v1 fallback preserves the single public KServe path.
    - name: chat
      matches:
        - path:
            type: Exact
            value: /v1/chat/completions
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: kserve-mock-inference-pool
      timeouts:
        request: 60s
    - name: inference
      matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: kserve-mock-inference-pool
      timeouts:
        request: 60s

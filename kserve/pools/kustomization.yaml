apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One KServe serving pool per accelerator class. Requires the shared base from
# kserve/kustomization.yaml, which supplies the namespace, the runtime source
# ConfigMap, and the empty CPU presets.
resources:
  - route.yaml
  - kserve-b300.yaml
  - kserve-h200.yaml
  - kserve-h100.yaml
  - kserve-l40s.yaml

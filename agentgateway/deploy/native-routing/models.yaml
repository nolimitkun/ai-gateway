---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: deepseek-v4-flash
  namespace: ai-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
      sectionName: native
  match:
    model: deepseek-v4-flash
  provider: Custom
  custom:
    backendRef:
      group: inference.networking.k8s.io
      kind: InferencePool
      name: kserve-h200-inference-pool
    formats:
      - type: Completions
  policies:
    # The one medium-tier model. A ceiling admits its own tier and everything
    # above it, so this names both rather than testing equality.
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'jwt.tier in ["big", "medium"]'
---

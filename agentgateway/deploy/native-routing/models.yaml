# Native model routing for agentgateway: no body-based router involved.
#
# agentgateway v1.4.1 reads the model out of the request itself. The
# AgentgatewayModel CRD describes `match.model` as the "Model name matched
# against client requests", and a `Custom` provider's backendRef "may target
# only a namespace-local Service or InferencePool" -- which is exactly the
# BBR path's destination. So the twelve model-to-pool mappings in
# kserve/pools/route.yaml can be expressed without the header BBR writes.
#
# Models attach to a Gateway, not to a hostname: the CRD has parentRefs and no
# hostnames field. To keep the overlay non-destructive they are parented to a
# dedicated `native` listener, added by this directory's gateway.yaml and
# carrying the native.local hostname, so the ordinary BBR path keeps serving
# every other request in the same cluster.
#
# The four models above small tier carry their own authorization rule. That is
# the part with no equivalent on the other stacks: the tier ceiling lives on
# the model rather than on a header test, so it cannot be bypassed by a client
# forging a routing header, and it survives BBR being deleted. The rule is the
# same CEL the header-based policy uses, minus the header test -- being
# attached to kimi-k3 already says which tier it governs, so the expression
# only has to name the ceiling.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: kimi-k3
  namespace: ai-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
      sectionName: native
  match:
    model: kimi-k3
  provider: Custom
  custom:
    backendRef:
      group: inference.networking.k8s.io
      kind: InferencePool
      name: kserve-b300-inference-pool
    formats:
      - type: Completions
  policies:
    # The big-tier ceiling, expressed where the model is defined rather than
    # as a header test on a routing header no longer being written.
    # `Require` is cumulative here as it is for traffic rules, so this
    # stacks on top of the listener-wide small-tier rule.
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'jwt.tier == "big"'
---

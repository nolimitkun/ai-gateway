# One HTTPRoute per production service. Chat is the only task with more than
# one model, so its five services share /v1/chat/completions and are separated
# by the X-Gateway-Model-Name header the body-based router writes from
# body.model. Gateway API ranks a rule with a header match above the otherwise
# identical rule without one, so the unheadered `chat` rule below is the
# fallback that also serves the `auto` alias.
#
# The tier ceiling is attached per route, not per header value: a forged
# X-Gateway-Model-Name can only move a caller onto a different route, and that
# route's own policy still applies. BBR overwrites the header on every rule
# named here in any case.
#
# Every rule name is vllm- prefixed. Istio addresses BBR's per-route enablement
# by Envoy route name, and on a cluster that also carries the mock fixture the
# unprefixed names (chat, embeddings, rerank) are already taken by
# HTTPRoute/kserve-mock.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-chat
  namespace: ai-demo
  labels: {ai-gateway.openai/model-tier: small}
spec:
  parentRefs: [{name: ai-gateway}]
  rules:
    - name: vllm-chat
      matches:
        - path: {type: Exact, value: /v1/chat/completions}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-chat-inference-pool
      timeouts: {request: 300s}
    # The catalog GET carries no body for BBR to read and is not tier-gated
    # beyond the shared small-tier ceiling.
    - name: vllm-models
      matches:
        - path: {type: PathPrefix, value: /v1/models}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-chat-inference-pool
      timeouts: {request: 300s}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-kimi-k3
  namespace: ai-demo
  labels: {ai-gateway.openai/model-tier: big}
spec:
  parentRefs: [{name: ai-gateway}]
  rules:
    - name: vllm-chat-kimi-k3
      matches:
        - path: {type: Exact, value: /v1/chat/completions}
          headers: [{name: x-gateway-model-name, value: kimi-k3}]
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-kimi-k3-inference-pool
      timeouts: {request: 300s}
---

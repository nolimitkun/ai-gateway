  namespace: ai-demo
  labels: {ai-gateway.openai/model-tier: small}
spec:
  parentRefs: [{name: ai-gateway}]
  rules:
    # Multipart bodies are outside BBR v1.2.1 and every speech model is small,
    # so this route needs no model header to stay unambiguous.
    - name: vllm-transcription
      matches:
        - path: {type: Exact, value: /v1/audio/transcriptions}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-transcription-inference-pool
      timeouts: {request: 300s}

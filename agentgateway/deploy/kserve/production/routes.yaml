apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-chat
  namespace: ai-demo
spec:
  parentRefs: [{name: ai-gateway}]
  rules:
    - matches:
        - path: {type: Exact, value: /v1/chat/completions}
        - path: {type: PathPrefix, value: /v1/models}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-chat-inference-pool
      timeouts: {request: 300s}
---

# Production carries all three tiers, so the ceiling is attached per route
# rather than once for the whole profile. JWT authentication covers every
# route; the authorization policies below then differ only in which tier
# claims they admit. Nothing here reads org, team, group, or plan.
#
# BBR needs no production-specific attachment on this stack: its ext_proc is a
# PreRouting policy on the Gateway itself, conditioned on request.path, so
# /v1/chat/completions is already covered whichever route serves it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: vllm-jwt
  namespace: ai-demo
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-chat}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-kimi-k3}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-glm-5-3}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-deepseek-v4-pro}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-deepseek-v4-flash}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-embedding}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-rerank}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-transcription}
  traffic:
    jwtAuthentication:
      mode: Strict
      location:
        header: {name: Authorization, prefix: "Bearer "}
      providers:
        - issuer: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway
          audiences: [ai-gateway]
          jwks:
            remote:
              backendRef: {name: keycloak, port: 8080}
              jwksPath: /realms/ai-gateway/protocol/openid-connect/certs
              cacheDuration: 5m
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: vllm-small-tier
  namespace: ai-demo
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-chat}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-embedding}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-rerank}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-transcription}
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'has(jwt.tier) && jwt.tier in ["big", "medium", "small"]'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: vllm-medium-tier
  namespace: ai-demo
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-deepseek-v4-flash}
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'has(jwt.tier) && jwt.tier in ["big", "medium"]'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: vllm-big-tier
  namespace: ai-demo
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-kimi-k3}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-glm-5-3}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-deepseek-v4-pro}
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'has(jwt.tier) && jwt.tier == "big"'

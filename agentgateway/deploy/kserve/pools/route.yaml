# Expanded form of HTTPRoute/kserve-mock used while accelerator fixtures are
# installed. The client sends only the OpenAI `model` field. The official BBR
# processor copies it to X-Gateway-Model-Name and clears the route cache; these
# internal matches then select the correct KServe InferencePool.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  rules:
    - name: model-kimi-k3
      matches:
        - path: {type: Exact, value: /v1/chat/completions}
          headers: [{name: x-gateway-model-name, value: kimi-k3}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-b300-inference-pool}
      timeouts: {request: 60s}
    - name: model-glm-5-3
      matches:
        - path: {type: Exact, value: /v1/chat/completions}
          headers: [{name: x-gateway-model-name, value: glm-5.3}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-b300-inference-pool}
      timeouts: {request: 60s}
    - name: model-deepseek-v4-pro
      matches:
        - path: {type: Exact, value: /v1/chat/completions}
          headers: [{name: x-gateway-model-name, value: deepseek-v4-pro}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-b300-inference-pool}
      timeouts: {request: 60s}
    - name: model-deepseek-v4-flash
      matches:
        - path: {type: Exact, value: /v1/chat/completions}
          headers: [{name: x-gateway-model-name, value: deepseek-v4-flash}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-h200-inference-pool}
      timeouts: {request: 60s}
    - name: model-qwen3-8-27b
      matches:
        - path: {type: Exact, value: /v1/chat/completions}
          headers: [{name: x-gateway-model-name, value: qwen3.8-27b}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-h100-inference-pool}
      timeouts: {request: 60s}
    - name: model-qwen3-embedding-8b
      matches:
        - path: {type: Exact, value: /v1/embeddings}
          headers: [{name: x-gateway-model-name, value: qwen3-embedding-8b}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-h100-inference-pool}
      timeouts: {request: 60s}
    - name: model-e5-mistral-7b-instruct
      matches:
        - path: {type: Exact, value: /v1/embeddings}
          headers: [{name: x-gateway-model-name, value: e5-mistral-7b-instruct}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-h100-inference-pool}
      timeouts: {request: 60s}
    - name: model-bge-m3
      matches:
        - path: {type: Exact, value: /v1/embeddings}
          headers: [{name: x-gateway-model-name, value: bge-m3}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-l40s-inference-pool}
      timeouts: {request: 60s}
    - name: model-jina-embeddings-v3
      matches:
        - path: {type: Exact, value: /v1/embeddings}
          headers: [{name: x-gateway-model-name, value: jina-embeddings-v3}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-l40s-inference-pool}
      timeouts: {request: 60s}
    - name: model-nomic-embed-text-v2-moe
      matches:
        - path: {type: Exact, value: /v1/embeddings}
          headers: [{name: x-gateway-model-name, value: nomic-embed-text-v2-moe}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-l40s-inference-pool}
      timeouts: {request: 60s}
    - name: model-bge-reranker-v2-m3
      matches:
        - path: {type: Exact, value: /v1/rerank}
          headers: [{name: x-gateway-model-name, value: bge-reranker-v2-m3}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-l40s-inference-pool}
      timeouts: {request: 60s}
    - name: model-jina-reranker-v2-base-multilingual
      matches:
        - path: {type: Exact, value: /v1/rerank}
          headers: [{name: x-gateway-model-name, value: jina-reranker-v2-base-multilingual}]
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-l40s-inference-pool}
      timeouts: {request: 60s}
    # Base CPU route and public API fallback. Header-specific matches above win
    # only after BBR has extracted a recognized explicit model.
    - name: chat
      matches:
        - path: {type: Exact, value: /v1/chat/completions}
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-mock-inference-pool}
      timeouts: {request: 60s}
    - name: embeddings
      matches:
        - path: {type: Exact, value: /v1/embeddings}
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-mock-inference-pool}
      timeouts: {request: 60s}
    - name: rerank
      matches:
        - path: {type: Exact, value: /v1/rerank}
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-mock-inference-pool}
      timeouts: {request: 60s}
    - name: inference
      matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: kserve-mock-inference-pool}
      timeouts: {request: 60s}

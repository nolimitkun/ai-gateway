# Keycloak authenticates the caller; one scalar `tier` claim is the complete
# model-authorization contract. Tiers are ceilings: big can use every tier,
# medium can use medium and small, and small can use small only.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: kserve-mock-jwt, namespace: ai-demo}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: kserve-mock}
  traffic:
    jwtAuthentication:
      mode: Strict
      location:
        header: {name: Authorization, prefix: "Bearer "}
      providers:
        - issuer: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway
          audiences: [ai-gateway]
          jwks:
            remote:
              backendRef: {name: keycloak, port: 8080}
              jwksPath: /realms/ai-gateway/protocol/openid-connect/certs
              cacheDuration: 5m
---
# Every served API is at least small tier. These Require policies are
# cumulative: the route-wide ceiling check runs for every request, then the
# model-specific medium or big check runs only when BBR resolved that tier.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: kserve-mock-small-tier, namespace: ai-demo}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: kserve-mock}
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'has(jwt.tier) && jwt.tier in ["big", "medium", "small"]'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: kserve-mock-medium-tier, namespace: ai-demo}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: kserve-mock}
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - '!("x-gateway-model-name" in request.headers) || request.headers["x-gateway-model-name"] != "deepseek-v4-flash" || jwt.tier in ["big", "medium"]'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: kserve-mock-big-tier, namespace: ai-demo}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: kserve-mock}
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - '!("x-gateway-model-name" in request.headers) || !(request.headers["x-gateway-model-name"] in ["kimi-k3", "glm-5.3", "deepseek-v4-pro"]) || jwt.tier == "big"'

# agentgateway rate limiting. Local limits are counted inside the proxy, so
# no Redis and no rate limit service are involved; the trade-off is that the
# budget is per proxy instance and the coarsest local window is an hour, so a
# daily quota needs the global (external) rate limit service instead.
#
# Version 1.6 supports CEL keys on each local rule. Multiple rules in the
# selected conditional policy charge org and team buckets for one request.
# Identity keys use verified JWT claims, never client identity headers.
# The fixture explicitly maps preferred_username; sub is absent from its
# custom client scope and would fall into the shared missing-key bucket.
# These remain bounded, in-memory counters per proxy; replicas do not share
# budgets and eviction/restarts can reset them. Global mode is needed for
# distributed or durable quotas. Probe headers only isolate test windows.
#
# Token units require an agentgateway AI backend with tokenization enabled.
# KServe's InferencePool integration is a generic Gateway API backend and does
# not publish agentgateway's AI token metadata, so this path intentionally
# compares request and quota limits only rather than claiming an inert budget.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kserve-mock-rate-limit
  namespace: ai-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kserve-mock
  traffic:
    rateLimit:
      conditional:
        - condition: '"x-rate-limit-probe" in request.headers'
          policy:
            local:
              - requests: 5
                unit: Minutes
                key: jwt.preferred_username
        - condition: '"x-quota-probe" in request.headers'
          policy:
            local:
              - requests: 3
                unit: Hours
                key: jwt.preferred_username + ":" + request.headers["x-quota-probe"]
        - condition: '"x-tenant-probe" in request.headers'
          policy:
            local:
              - requests: 5
                unit: Hours
                key: jwt.org + ":" + request.headers["x-tenant-probe"]
              - requests: 3
                unit: Hours
                key: jwt.org + ":" + jwt.team + ":" + request.headers["x-tenant-probe"]

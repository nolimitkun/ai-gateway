# Token issuance travels the same gateway as inference traffic, so the
# comparison needs no extra host port. Only the OIDC endpoints are exposed;
# the Keycloak admin console is not routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: ai-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms
      backendRefs:
        - name: keycloak
          port: 8080
      timeouts:
        request: 30s

# agentgateway multiplexes MCP servers through AgentgatewayBackend.spec.mcp.
# `prefixMode: Conditional` prefixes tool names only when needed to resolve a
# collision -- both mock servers expose `get_time`, so this is exercised.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp
  namespace: ai-demo
spec:
  mcp:
    prefixMode: Conditional
    sessionRouting: Stateful
    failureMode: FailOpen
    targets:
      - name: clock
        static:
          backendRef: {name: mcp-clock}
          port: 80
          path: /mcp
      - name: math
        static:
          backendRef: {name: mcp-math}
          port: 80
          path: /mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: ai-demo
spec:
  parentRefs:
    - name: ai-gateway
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp

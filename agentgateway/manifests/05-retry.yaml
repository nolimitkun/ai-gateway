# agentgateway's equivalent: one AgentgatewayPolicy carrying the retry config.
# Ordered `groups` in the AgentgatewayBackend supply the failover order.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: retry-failover
  namespace: ai-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  traffic:
    retry:
      attempts: 3
      codes: [503]
      backoff: 100ms
---
# Retry alone keeps hitting the same provider (observed: retry.attempt=3, same
# endpoint). Falling through to the next priority group is driven by *passive
# health eviction* instead -- once alpha is evicted, group 1 (beta) serves.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: failover-health
  namespace: ai-demo
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mock-failover
  backend:
    health:
      # Required: the default "any 5xx is unhealthy" only lowers the health
      # score, it never evicts on its own. Eviction needs an explicit CEL rule.
      unhealthyCondition: "response.code >= 500"
      eviction:
        consecutiveFailures: 2
        duration: 10s

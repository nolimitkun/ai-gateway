# agentgateway routes LLM traffic with a stock Gateway API HTTPRoute whose
# backendRef points at an AgentgatewayBackend. Header-based model selection is
# done with normal HTTPRoute matches; the AI-specific behaviour lives in the
# backend, not in a bespoke route type.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: ai-demo
spec:
  parentRefs:
    - name: ai-gateway
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
          headers:
            - {name: x-route-to, value: beta}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mock-beta
    - matches:
        - path: {type: PathPrefix, value: /v1}
          headers:
            - {name: x-route-to, value: failover}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mock-failover
    # Weighted split -- the A/B case, matching the Envoy side's weighted rule.
    - matches:
        - path: {type: PathPrefix, value: /v1}
          headers:
            - {name: x-route-to, value: split}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mock-alpha
          weight: 80
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mock-beta
          weight: 20
    - matches:
        - path: {type: PathPrefix, value: /v1}
          headers:
            - {name: x-route-to, value: anthropic}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: probe-anthropic
    - matches:
        - path: {type: PathPrefix, value: /v1}
          headers:
            - {name: x-route-to, value: gemini}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: probe-gemini
    - matches:
        - path: {type: PathPrefix, value: /v1}
          headers:
            - {name: x-route-to, value: bedrock}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: probe-bedrock
    - matches:
        - path: {type: PathPrefix, value: /v1}
          headers:
            - {name: x-route-to, value: messages}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: probe-messages
    - matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mock-alpha

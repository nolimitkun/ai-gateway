# One EPP server certificate per accelerator pool, issued by the private CA
# that kuadrant/kserve-overlay/epp-certificate.yaml creates for the base
# service. Istio verifies each pool's endpoint picker against the same CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kserve-b300-epp-server
  namespace: ai-demo
spec:
  secretName: kserve-b300-epp-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - kserve-b300-epp-service.ai-demo.svc
    - kserve-b300-epp-service.ai-demo.svc.cluster.local
  usages:
    - server auth
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: kserve-mock-epp-ca
---

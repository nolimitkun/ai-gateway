apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenShift profile variant of the accelerator pools: the shared
# openshift-ai-inference Gateway plus a cert-manager-issued endpoint picker
# certificate per pool.
resources:
  - route.yaml
  - kserve-b300.yaml
  - kserve-h200.yaml
  - kserve-h100.yaml
  - kserve-l40s.yaml
  - pool-certificates.yaml
  - pool-epp-tls.yaml
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: kserve-mock
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: openshift-ai-inference
      - op: add
        path: /spec/parentRefs/0/namespace
        value: openshift-ingress
  - target:
      group: serving.kserve.io
      version: v1alpha2
      kind: LLMInferenceService
      name: kserve-b300
    patch: |-
      - op: replace
        path: /spec/router/gateway/refs/0/name
        value: openshift-ai-inference
      - op: replace
        path: /spec/router/gateway/refs/0/namespace
        value: openshift-ingress
      - op: replace
        path: /spec/router/scheduler/template/volumes/0/secret/secretName
        value: kserve-b300-epp-tls

  - target:
      group: serving.kserve.io
      version: v1alpha2
      kind: LLMInferenceService
      name: kserve-h200
    patch: |-
      - op: replace
        path: /spec/router/gateway/refs/0/name
        value: openshift-ai-inference
      - op: replace
        path: /spec/router/gateway/refs/0/namespace
        value: openshift-ingress
      - op: replace
        path: /spec/router/scheduler/template/volumes/0/secret/secretName
        value: kserve-h200-epp-tls

  - target:
      group: serving.kserve.io
      version: v1alpha2
      kind: LLMInferenceService
      name: kserve-h100
    patch: |-
      - op: replace
        path: /spec/router/gateway/refs/0/name
        value: openshift-ai-inference
      - op: replace
        path: /spec/router/gateway/refs/0/namespace
        value: openshift-ingress
      - op: replace
        path: /spec/router/scheduler/template/volumes/0/secret/secretName
        value: kserve-h100-epp-tls

  - target:
      group: serving.kserve.io
      version: v1alpha2
      kind: LLMInferenceService
      name: kserve-l40s
    patch: |-
      - op: replace
        path: /spec/router/gateway/refs/0/name
        value: openshift-ai-inference
      - op: replace
        path: /spec/router/gateway/refs/0/namespace
        value: openshift-ingress
      - op: replace
        path: /spec/router/scheduler/template/volumes/0/secret/secretName
        value: kserve-l40s-epp-tls

# Istio verifies KServe's TLS-secured endpoint picker with the CA ConfigMap
# generated from the cert-manager-issued server Secret by deploy-kserve.sh.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: kserve-mock-epp
  namespace: ai-demo
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: kserve-mock-epp-service
      sectionName: grpc
  validation:
    hostname: kserve-mock-epp-service.ai-demo.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: kserve-mock-epp-ca

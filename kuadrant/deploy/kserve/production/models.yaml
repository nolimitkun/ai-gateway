# A vLLM process loads one model/task. Keep model aliases synchronized with the
# request bodies used by scripts/validate-vllm-contract.py.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: vllm-chat
  namespace: ai-demo
  labels: {ai-gateway.openai/model-tier: small}
spec:
  baseRefs: [{name: vllm-production}]
  model:
    uri: hf://Qwen/Qwen3.8-27B
    name: qwen3.8-27b
  storageInitializer: {enabled: true}
  replicas: 1
  template:
    containers:
      - name: main
        # vLLM accepts multiple served names and answers with the first. With
        # one chat model in this production profile, auto is a safe alias for
        # the concrete small-tier model rather than an ungoverned model.
        args: [--served-model-name, qwen3.8-27b, auto, --port, "8000", --max-model-len, "32768", --gpu-memory-utilization, "0.90"]
        resources:
          requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "8", memory: 48Gi, nvidia.com/gpu: "1"}
    nodeSelector: {nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3}
    tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  router:
    gateway: {refs: [{name: ai-gateway, namespace: ai-demo}]}
    route: {http: {refs: [{name: vllm-chat}]}}
---

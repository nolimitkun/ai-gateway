# Production carries all three tiers, so the ceiling is attached per route
# rather than once for the whole profile. Kuadrant has no cross-route policy,
# so each route gets its own AuthPolicy: the Keycloak authentication block is
# identical everywhere and only the admitted tier claims differ. Nothing here
# reads org, team, group, or plan.
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata: {name: vllm-chat, namespace: ai-demo}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: vllm-chat}
  rules:
    authentication:
      keycloak:
        jwt:
          issuerUrl: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway
        credentials:
          authorizationHeader: {prefix: Bearer}
    authorization:
      small-tier:
        patternMatching:
          patterns:
            - any:
                - {selector: auth.identity.tier, operator: eq, value: big}
                - {selector: auth.identity.tier, operator: eq, value: medium}
                - {selector: auth.identity.tier, operator: eq, value: small}
    response:
      unauthenticated:
        code: 401
        message: {value: "a Keycloak access token is required"}
      unauthorized:
        code: 403
        message: {value: "the token identity is not allowed to call this model tier"}

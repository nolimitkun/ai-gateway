---
# Five chat services share /v1/chat/completions, so production needs the same
# body-based router the fixture uses. Istio has no Gateway API policy for BBR,
# and llm-d/kuadrant-extproc.yaml disables the filter at the virtual host and
# re-enables it per Envoy route name -- names taken from HTTPRoute/kserve-mock.
# Production's route sections are not in that list, so without this filter BBR
# never runs on them and every chat request falls to the unheadered rule.
#
# It covers the unheadered fallback as well as every model rule, so a
# client-forged X-Gateway-Model-Name is overwritten even when that header is
# what selected the route in the first place.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: model-body-router-vllm
  namespace: openshift-ingress
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: openshift-ai-inference
  configPatches:
    - applyTo: HTTP_ROUTE
      match: {context: GATEWAY, routeConfiguration: {vhost: {route: {name: vllm-chat}}}}
      patch: &vllm_bbr_patch
        operation: MERGE
        value:
          typed_per_filter_config:
            ai.gateway.body_based_router:
              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              overrides:
                processing_mode:
                  request_header_mode: SEND
                  response_header_mode: SKIP
                  request_body_mode: BUFFERED
                  response_body_mode: NONE
                  request_trailer_mode: SKIP
                  response_trailer_mode: SKIP
                grpc_service:
                  envoy_grpc:
                    cluster_name: outbound|9004||body-based-router.ai-demo.svc.cluster.local
                  timeout: 10s
                failure_mode_allow: false
    - applyTo: HTTP_ROUTE
      match: {context: GATEWAY, routeConfiguration: {vhost: {route: {name: vllm-chat-kimi-k3}}}}
      patch: *vllm_bbr_patch
    - applyTo: HTTP_ROUTE
      match: {context: GATEWAY, routeConfiguration: {vhost: {route: {name: vllm-chat-glm-5-3}}}}
      patch: *vllm_bbr_patch
    - applyTo: HTTP_ROUTE
      match: {context: GATEWAY, routeConfiguration: {vhost: {route: {name: vllm-chat-deepseek-v4-pro}}}}
      patch: *vllm_bbr_patch
    - applyTo: HTTP_ROUTE
      match: {context: GATEWAY, routeConfiguration: {vhost: {route: {name: vllm-chat-deepseek-v4-flash}}}}
      patch: *vllm_bbr_patch

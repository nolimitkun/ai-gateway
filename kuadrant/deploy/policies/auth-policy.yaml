# Kuadrant authentication and authorization for the KServe route.
#
# Authorino verifies the Keycloak access token, then two authorization rules
# run: every caller must belong to the `model-users` group, and only
# `platform-admins` may reach the B300 pool. The exported identity headers are
# also useful to the upstream application and make the authenticated identity
# visible in access logs.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kserve-mock
  rules:
    authentication:
      keycloak:
        jwt:
          issuerUrl: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway
        credentials:
          authorizationHeader:
            prefix: Bearer
    authorization:
      model-users:
        patternMatching:
          patterns:
            - selector: auth.identity.groups
              operator: incl
              value: model-users
      # Admins, or a team entitled to the class. Authorization rules here are
      # cumulative, so the entitlement cannot be added as a fourth rule --
      # that rule would simply fail for everybody else. It has to widen the
      # rule that already denies, which Authorino supports through `any`
      # (a logical OR over pattern expressions).
      #
      # agentgateway has the same cumulative constraint and the same fix.
      # Envoy Gateway has the mirror-image one: rules are first-match-wins
      # there, so widening is a prepend and it is the restriction that risks
      # becoming unreachable.
      #
      # The entitled arm reads the scalar `team` claim rather than the group
      # path, matching how the other rules here are written. Authorino also
      # accepts a CEL `predicate`, which could test the path claim as a
      # subtree the way agentgateway does; the selector form is used because
      # it is the mechanism the rest of this policy already proves out.
      kimi-k3-needs-admin-or-entitled-team:
        when:
          - selector: request.headers.x-gateway-model-name
            operator: eq
            value: kimi-k3
        patternMatching:
          patterns:
            - any:
                - selector: auth.identity.groups
                  operator: incl
                  value: platform-admins
                - selector: auth.identity.team
                  operator: eq
                  value: research
      glm-5-3-needs-admin-or-entitled-team:
        when:
          - selector: request.headers.x-gateway-model-name
            operator: eq
            value: glm-5.3
        patternMatching:
          patterns:
            - any:
                - selector: auth.identity.groups
                  operator: incl
                  value: platform-admins
                - selector: auth.identity.team
                  operator: eq
                  value: research
      deepseek-v4-pro-needs-admin-or-entitled-team:
        when:
          - selector: request.headers.x-gateway-model-name
            operator: eq
            value: deepseek-v4-pro
        patternMatching:
          patterns:
            - any:
                - selector: auth.identity.groups
                  operator: incl
                  value: platform-admins
                - selector: auth.identity.team
                  operator: eq
                  value: research
    response:
      success:
        headers:
          x-auth-user:
            plain:
              selector: auth.identity.preferred_username
          x-auth-plan:
            plain:
              selector: auth.identity.plan
          # Injected so the rate limit policies have something identity-shaped
          # to key nested counters on. Whether the rate limit action actually
          # sees headers this filter injected is the open question in this
          # topology -- see rate-limit-policy.yaml, and the comparison row
          # that measures it rather than assuming either answer.
          x-auth-org:
            plain:
              selector: auth.identity.org
          x-auth-team:
            plain:
              selector: auth.identity.team
      unauthenticated:
        code: 401
        message:
          value: "a Keycloak access token is required; POST /realms/ai-gateway/protocol/openid-connect/token"
      unauthorized:
        code: 403
        message:
          value: "the token identity is not allowed to call this model class"

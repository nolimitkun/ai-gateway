# Authorino verifies Keycloak JWTs and authorizes exclusively from the scalar
# `tier` ceiling. Org/team claims remain available for tenant rate limiting but
# never grant model access.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata: {name: kserve-mock, namespace: ai-demo}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: kserve-mock}
  rules:
    authentication:
      keycloak:
        jwt:
          issuerUrl: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway
        credentials:
          authorizationHeader: {prefix: Bearer}
    authorization:
      small-tier:
        patternMatching:
          patterns:
            - any:
                - {selector: auth.identity.tier, operator: eq, value: big}
                - {selector: auth.identity.tier, operator: eq, value: medium}
                - {selector: auth.identity.tier, operator: eq, value: small}
      medium-tier:
        when:
          - {selector: request.headers.x-gateway-model-name, operator: eq, value: deepseek-v4-flash}
        patternMatching:
          patterns:
            - any:
                - {selector: auth.identity.tier, operator: eq, value: big}
                - {selector: auth.identity.tier, operator: eq, value: medium}
      kimi-k3-big-tier:
        when:
          - {selector: request.headers.x-gateway-model-name, operator: eq, value: kimi-k3}
        patternMatching:
          patterns:
            - {selector: auth.identity.tier, operator: eq, value: big}
      glm-5-3-big-tier:
        when:
          - {selector: request.headers.x-gateway-model-name, operator: eq, value: glm-5.3}
        patternMatching:
          patterns:
            - {selector: auth.identity.tier, operator: eq, value: big}
      deepseek-v4-pro-big-tier:
        when:
          - {selector: request.headers.x-gateway-model-name, operator: eq, value: deepseek-v4-pro}
        patternMatching:
          patterns:
            - {selector: auth.identity.tier, operator: eq, value: big}
    response:
      success:
        headers:
          x-auth-user:
            plain: {selector: auth.identity.preferred_username}
          x-auth-tier:
            plain: {selector: auth.identity.tier}
          x-auth-org:
            plain: {selector: auth.identity.org}
          x-auth-team:
            plain: {selector: auth.identity.team}
      unauthenticated:
        code: 401
        message:
          value: "a Keycloak access token is required; POST /realms/ai-gateway/protocol/openid-connect/token"
      unauthorized:
        code: 403
        message: {value: "the token tier does not allow the resolved model tier"}

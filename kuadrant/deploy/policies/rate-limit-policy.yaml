# Request rate limiting and a daily quota probe, replacing the deliberately
# neutral policy applied by `make up`.
#
# The `comparison` limit stays high so latency sampling is unaffected. The
# probe limits are selected by an opt-in request header, which is what lets a
# comparison run measure enforcement without spending ordinary traffic's
# quota. These are intentionally shared counters: Kuadrant 1.5.2's Istio Wasm
# integration does not expose Authorino's `auth.identity` metadata to the
# rate-limit action in this local KServe topology.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kserve-mock
  limits:
    comparison:
      rates:
        - limit: 10000
          window: 1m
    burst-probe:
      rates:
        - limit: 5
          window: 1m
      when:
        - predicate: '"x-rate-limit-probe" in request.headers'
    daily-quota-probe:
      rates:
        - limit: 3
          window: 24h
      when:
        - predicate: '"x-quota-probe" in request.headers'
    # Nested tenant buckets: org, then org+team. `counters` is the mechanism
    # the other two stacks reach for as descriptors or client selectors -- one
    # named limit per level, each with its own CEL counter, all of them
    # charged for a request that matches, so whichever empties first returns
    # the 429.
    #
    # These key on the headers the AuthPolicy injects rather than on
    # `auth.identity`, because the shared counters above document that
    # Kuadrant 1.5.2's Istio Wasm integration does not surface Authorino's
    # identity metadata to the rate limit action in this topology. Counters
    # are CEL over Envoy's well-known attributes, and `request.headers` is one
    # of them, so this is the plausible way around that -- but "plausible" is
    # not "verified", and it is exactly the kind of claim that fails silently
    # by sharing one bucket between every tenant.
    #
    # So the comparison probes it with two members of two teams in one org and
    # reports which of the three outcomes actually happened: nested, shared,
    # or unenforced. Do not promote this to a documented capability until that
    # row says nested.
    tenant-org-probe:
      rates:
        - limit: 5
          window: 1h
      when:
        - predicate: '"x-tenant-probe" in request.headers'
      counters:
        - expression: request.headers["x-tenant-probe"]
        - expression: request.headers["x-auth-org"]
    tenant-team-probe:
      rates:
        - limit: 3
          window: 1h
      when:
        - predicate: '"x-tenant-probe" in request.headers'
      counters:
        - expression: request.headers["x-tenant-probe"]
        - expression: request.headers["x-auth-org"]
        - expression: request.headers["x-auth-team"]

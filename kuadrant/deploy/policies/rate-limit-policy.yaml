# Request rate limiting and a daily quota probe, replacing the deliberately
# neutral policy applied by `make up`.
#
# The `comparison` limit stays high so latency sampling is unaffected. The
# probe limits are selected by an opt-in request header, which is what lets a
# comparison run measure enforcement without spending ordinary traffic's
# quota. These are intentionally shared counters: Kuadrant 1.5.2's Istio Wasm
# integration does not expose Authorino's `auth.identity` metadata to the
# rate-limit action in this local KServe topology.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kserve-mock
  limits:
    comparison:
      rates:
        - limit: 10000
          window: 1m
    burst-probe:
      rates:
        - limit: 5
          window: 1m
      when:
        - predicate: '"x-rate-limit-probe" in request.headers'
    daily-quota-probe:
      rates:
        - limit: 3
          window: 24h
      when:
        - predicate: '"x-quota-probe" in request.headers'
    # Nested tenant buckets: org, then org+team. `counters` is the mechanism
    # the other two stacks reach for as descriptors or client selectors -- one
    # named limit per level, each with its own CEL counter, all of them
    # charged for a request that matches, so whichever empties first returns
    # the 429.
    #
    # These key on the headers the AuthPolicy injects rather than on
    # `auth.identity`, because the shared counters above document that
    # Kuadrant 1.5.2's Istio Wasm integration does not surface Authorino's
    # identity metadata to the rate limit action in this topology. Counters
    # are CEL over Envoy's well-known attributes, and `request.headers` is one
    # of them, so this looked like the way around that.
    #
    # A live run says it is not, and the comparison row reads "unenforced".
    # Three keyings were measured against these limits:
    #
    #   auth.identity.org / .team    unenforced -- confirms the note above
    #   the injected x-auth-org      unenforced -- Authorino adds these
    #     / x-auth-team headers        toward the upstream, so they are not in
    #                                  request.headers when the wasm rate
    #                                  limit action evaluates; the descriptor
    #                                  is absent and the limit is skipped
    #   a client-supplied             ENFORCED at the cap -- and therefore
    #     x-auth-org / x-auth-team      forgeable: exhausting a real bucket to
    #                                   429 and resending the same token with
    #                                   `x-auth-org: evil` returns 200
    #
    # The only keying that binds is the one a caller controls, which is not a
    # tenancy control at all. That is what the tenant_header_spoof row reports
    # for this stack. The limits are kept, unpromoted, because they are what
    # the comparison measures; do not describe this as a capability unless the
    # nesting row starts saying "nested".
    #
    # Quote these expressions with single quotes. Kuadrant interpolates the
    # expression text into a CEL string for Limitador's `variables`, so
    # request.headers["x"] becomes descriptors[0]["request.headers["x"]"],
    # whose inner quotes end the string early. Limitador rejects the whole
    # limit file over it -- not just this limit -- and crash-loops on a cold
    # start, taking every rate limit in this policy with it, while the
    # RateLimitPolicy still reports Enforced: True. Verified by reproducing
    # the CrashLoopBackOff. scripts/validate-tenant-model.py rejects a double
    # quote here so it cannot come back.
    tenant-org-probe:
      rates:
        - limit: 5
          window: 1h
      when:
        - predicate: '"x-tenant-probe" in request.headers'
      counters:
        - expression: request.headers['x-tenant-probe']
        - expression: request.headers['x-auth-org']
    tenant-team-probe:
      rates:
        - limit: 3
          window: 1h
      when:
        - predicate: '"x-tenant-probe" in request.headers'
      counters:
        - expression: request.headers['x-tenant-probe']
        - expression: request.headers['x-auth-org']
        - expression: request.headers['x-auth-team']

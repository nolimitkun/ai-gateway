# Local analogue of OpenShift's shared inference Gateway. OpenShift's Ingress
# Operator is unavailable on kind, so Istio supplies the Gateway API controller
# and Envoy data plane while preserving the OpenShift names and topology.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-ingress
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openshift-default
spec:
  controllerName: istio.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
  labels:
    kuadrant.io/gateway: "true"
  annotations:
    networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: ai-demo

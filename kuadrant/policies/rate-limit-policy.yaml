# Request rate limiting and per-plan daily quota, replacing the deliberately
# neutral policy applied by `make up`.
#
# The `comparison` limit stays high so latency sampling is unaffected. The
# probe limits are selected by an opt-in request header, which is what lets a
# single comparison run measure enforcement without spending the quota that
# ordinary traffic shares.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kserve-mock
  limits:
    comparison:
      rates:
        - limit: 10000
          window: 1m
    burst-probe:
      rates:
        - limit: 5
          window: 1m
      counters:
        - expression: auth.identity.sub
      when:
        - predicate: '"x-rate-limit-probe" in request.headers'
    daily-quota-probe:
      rates:
        - limit: 3
          window: 24h
      counters:
        - expression: auth.identity.sub
        # A counter on the probe header gives every comparison run its own
        # daily bucket, so a second run on the same day still measures
        # enforcement instead of reporting an already-spent quota.
        - expression: request.headers["x-quota-probe"]
      when:
        - predicate: '"x-quota-probe" in request.headers'
    free-plan-quota:
      rates:
        - limit: 2000
          window: 24h
      counters:
        - expression: auth.identity.sub
      when:
        - predicate: 'auth.identity.plan == "free"'
    gold-plan-quota:
      rates:
        - limit: 20000
          window: 24h
      counters:
        - expression: auth.identity.sub
      when:
        - predicate: 'auth.identity.plan == "gold"'

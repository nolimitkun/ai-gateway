# Request rate limiting and a daily quota probe, replacing the deliberately
# neutral policy applied by `make up`.
#
# The `comparison` limit stays high so latency sampling is unaffected. The
# probe limits are selected by an opt-in request header, which is what lets a
# comparison run measure enforcement without spending ordinary traffic's
# quota. These are intentionally shared counters: Kuadrant 1.5.2's Istio Wasm
# integration does not expose Authorino's `auth.identity` metadata to the
# rate-limit action in this local KServe topology.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kserve-mock
  limits:
    comparison:
      rates:
        - limit: 10000
          window: 1m
    burst-probe:
      rates:
        - limit: 5
          window: 1m
      when:
        - predicate: '"x-rate-limit-probe" in request.headers'
    daily-quota-probe:
      rates:
        - limit: 3
          window: 24h
      when:
        - predicate: '"x-quota-probe" in request.headers'

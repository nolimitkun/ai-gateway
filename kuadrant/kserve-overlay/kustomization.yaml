apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kserve
  - epp-certificate.yaml
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: kserve-mock
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: openshift-ai-inference
      - op: add
        path: /spec/parentRefs/0/namespace
        value: openshift-ingress
  - target:
      group: serving.kserve.io
      version: v1alpha2
      kind: LLMInferenceService
      name: kserve-mock
    patch: |-
      - op: replace
        path: /spec/router/gateway/refs/0/name
        value: openshift-ai-inference
      - op: replace
        path: /spec/router/gateway/refs/0/namespace
        value: openshift-ingress
      - op: replace
        path: /spec/router/scheduler/template/volumes/0/secret/secretName
        value: kserve-mock-epp-tls

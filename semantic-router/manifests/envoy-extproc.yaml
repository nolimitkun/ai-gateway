# Envoy AI Gateway: chain semantic model choice before body-based pool routing.
#
# Envoy Gateway has a first-class Gateway API policy for external processing,
# so the whole attachment is one object with a typed backend reference and a
# status condition to check. It targets the KServe HTTPRoute rather than the
# Gateway, which keeps Keycloak's /realms endpoints on the same Gateway out of
# the router's path -- a token request is not a chat request and has no model
# to select.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  # This intentionally replaces the base chat BBR policy with the same name.
  # Envoy Gateway accepts one policy per target section, so both processors
  # are kept in one ordered extProc list while semantic routing is installed.
  name: model-body-router-chat
  namespace: ai-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kserve-mock
      # Only the exact chat rule is compatible with the semantic router's
      # OpenAI chat request contract. Other /v1 task APIs bypass ext_proc.
      sectionName: chat
  extProc:
    - backendRefs:
        - name: semantic-router
          port: 50051
      # Same contract as the other two stacks: a router that is unreachable
      # leaves the request untouched instead of failing it.
      failOpen: true
      messageTimeout: 10s
      processingMode:
        allowModeOverride: true
        request:
          # The model is chosen from the chat body, so the body is buffered
          # before the router is called.
          body: Buffered
        response: {}
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: body-based-router
      # Pool selection is part of the serving path. If BBR is down, do not
      # silently send a selected accelerator model to the shared CPU fixture.
      failOpen: false
      messageTimeout: 10s
      processingMode:
        request:
          body: Buffered
        response: {}

name: gateway comparison

# The full run builds and tests one retained kind cluster at a time. Per-stack
# JSON fragments are merged into README.md only after all three passes finish.
#
# Standard runners are free for public repositories and give this job 4 CPUs,
# 16 GB of RAM and a disk that needs clearing first. Only one cluster node runs
# at a time, while stopped nodes retain their installed state.
on:
  workflow_dispatch:
    inputs:
      features:
        description: also deploy Keycloak and the gateway feature policies
        type: boolean
        default: true
      router:
        description: also deploy the vLLM Semantic Router as each gateway's ext_proc
        type: boolean
        default: true
      requests:
        description: chat requests sampled per gateway (positive integer)
        type: string
        default: '30'
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: write

# One run at a time: the fixed host ports do not share a runner with a second
# copy, and a cancelled half-built run tells us nothing.
concurrency:
  group: gateway-comparison
  cancel-in-progress: false

env:
  # v0.32.0 defaults to the same kindest/node digest the cluster configs pin.
  KIND_VERSION: v0.32.0

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7

      - name: reclaim runner disk
        # Three clusters pull Istio, Envoy, KServe, Keycloak and Redis into
        # three separate containerd stores. The preinstalled toolchains this
        # job never touches are worth more to it as free space.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      - name: raise inotify limits
        # kubelet, containerd and the controllers in three clusters together
        # exhaust the runner's default watch and instance budget.
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_user_instances=8192

      - name: install cluster tooling
        run: |
          cd /tmp
          base="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          curl -fsSLO "$base/kind-linux-amd64"
          if curl -fsSLO "$base/kind-linux-amd64.sha256sum"; then
            sha256sum -c kind-linux-amd64.sha256sum
          else
            echo "::warning::no published checksum asset for ${KIND_VERSION}"
          fi
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
          command -v helm >/dev/null || \
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kind version
          kubectl version --client
          helm version --short

      - name: build the gateway environments sequentially
        run: make up-all
        timeout-minutes: 100

      - name: runner headroom after installation
        if: always()
        run: |
          free -h
          df -h /
          docker ps --format 'table {{.Names}}\t{{.Status}}'

      - name: deploy gateway feature policies sequentially
        if: github.event_name == 'schedule' || inputs.features
        run: make policies-all
        timeout-minutes: 45

      - name: deploy semantic routers sequentially
        # Keyword decisions load no model weights, so this costs an image pull
        # and about 256 MiB per cluster rather than the several GiB the
        # classifier profile would need.
        if: github.event_name == 'schedule' || inputs.router
        run: make semantic-router-all
        timeout-minutes: 30

      - name: run and merge the sequential comparison
        env:
          N: ${{ inputs.requests || '30' }}
        run: make compare-all | tee -a "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 35

      - name: commit the updated README
        run: |
          git diff --check
          if git diff --quiet -- README.md; then
            echo "README comparison rows are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh live gateway comparison"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: collect cluster diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          dump() { echo "===== $* ====="; "$@" 2>&1 || true; echo; }
          for cluster in ai-gw-kuadrant ai-gw-envoy ai-gw-agent; do
            ctx="kind-$cluster"
            kubectl config get-contexts "$ctx" >/dev/null 2>&1 || continue
            docker start "$cluster-control-plane" >/dev/null 2>&1 || continue
            kubectl --context "$ctx" wait --for=condition=Ready \
              "node/$cluster-control-plane" --timeout=120s >/dev/null 2>&1 || true
            {
              dump kubectl --context "$ctx" get pods -A -o wide
              dump kubectl --context "$ctx" get pods -A \
                --field-selector=status.phase!=Running -o yaml
              dump kubectl --context "$ctx" get gateway,httproute,inferencepool,llminferenceservice -A
              dump kubectl --context "$ctx" get authpolicy,ratelimitpolicy,tokenratelimitpolicy \
                -n ai-demo -o yaml
              dump kubectl --context "$ctx" get securitypolicy,backendtrafficpolicy,aigatewayroute \
                -n ai-demo -o yaml
              dump kubectl --context "$ctx" get agentgatewaypolicy -n ai-demo -o yaml
              dump kubectl --context "$ctx" get envoyfilter -A -o yaml
              dump kubectl --context "$ctx" get envoyextensionpolicy -n ai-demo -o yaml
              dump kubectl --context "$ctx" logs -n ai-demo deployment/semantic-router --tail=200
              dump kubectl --context "$ctx" get events -A --sort-by=.lastTimestamp
            } > "diagnostics/$cluster.txt"
            docker stop -t 5 "$cluster-control-plane" >/dev/null 2>&1 || true
          done
          { free -h; df -h /; } > diagnostics/runner.txt 2>&1

      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-comparison-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

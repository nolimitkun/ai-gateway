# Keep overlays outside the Keycloak base directory. Recent Kustomize releases
# reject a child overlay that imports its own ancestor as a resource cycle.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../keycloak
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: openshift-ai-inference
      - op: add
        path: /spec/parentRefs/0/namespace
        value: openshift-ingress

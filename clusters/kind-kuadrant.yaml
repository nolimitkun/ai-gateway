# Kuadrant policy layer with Envoy Gateway as its Gateway API provider.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-gw-kuadrant
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8082
        protocol: TCP

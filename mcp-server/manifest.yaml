# Two MCP servers with different tool sets, deployed into both clusters.
# Two rather than one so the comparison can test multiplexing: both gateways
# claim to aggregate several MCP servers behind a single endpoint. They also
# share a `get_time` tool name, which exposes how each gateway handles
# collisions.
#
# The ConfigMap is generated from mcp-server/server.py by
# scripts/deploy-mcp.sh -- server.py is the single source of truth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-clock
  namespace: ai-demo
  labels: {app: mcp, mcp-server: clock}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp, mcp-server: clock}
  template:
    metadata:
      labels: {app: mcp, mcp-server: clock}
    spec:
      containers:
        - name: server
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/srv/server.py"]
          env:
            - {name: SERVER_ID, value: "clock"}
            - {name: PORT, value: "8080"}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: src, mountPath: /srv}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 192Mi}
      volumes:
        - name: src
          configMap: {name: mcp-src}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-math
  namespace: ai-demo
  labels: {app: mcp, mcp-server: math}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp, mcp-server: math}
  template:
    metadata:
      labels: {app: mcp, mcp-server: math}
    spec:
      containers:
        - name: server
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/srv/server.py"]
          env:
            - {name: SERVER_ID, value: "math"}
            - {name: PORT, value: "8080"}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: src, mountPath: /srv}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 192Mi}
      volumes:
        - name: src
          configMap: {name: mcp-src}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-clock
  namespace: ai-demo
  labels: {mcp: "true"}
spec:
  selector: {app: mcp, mcp-server: clock}
  ports: [{name: http, port: 80, targetPort: 8080, appProtocol: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-math
  namespace: ai-demo
  labels: {mcp: "true"}
spec:
  selector: {app: mcp, mcp-server: math}
  ports: [{name: http, port: 80, targetPort: 8080, appProtocol: http}]

# Request rate limits, per-plan daily quotas, and the token budget, all as
# Envoy Gateway global rate limit rules counted in Redis.
#
# Buckets are keyed by the identity headers the SecurityPolicy copies out of
# the Keycloak token: x-user-id for the per-user rules, and x-org-id plus
# x-team-id for the nested tenant rules further down. The probe rules are
# selected by an opt-in header so a comparison run can exhaust them without
# spending the quota that ordinary traffic shares.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-rate-limit-probe
                  type: Exact
                  value: "true"
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 5
            unit: Minute
        # Distinct on the probe header gives every comparison run its own
        # daily bucket, so a second run on the same day still measures
        # enforcement instead of reporting an already-spent quota.
        - clientSelectors:
            - headers:
                - name: x-quota-probe
                  type: Distinct
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 3
            unit: Day
        - clientSelectors:
            - headers:
                - name: x-auth-plan
                  type: Exact
                  value: free
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 2000
            unit: Day
        - clientSelectors:
            - headers:
                - name: x-auth-plan
                  type: Exact
                  value: gold
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 20000
            unit: Day
        # Nested tenant buckets: org, then org+team. A request that carries
        # both headers matches both rules and decrements both counters --
        # "if a request matches multiple rules, each of their associated
        # limits get applied", and the limit service returns the logical OR of
        # their decisions. That intersection is what makes the levels nest:
        # whichever bucket empties first returns the 429.
        #
        # The team limit is deliberately over-subscribed against the org
        # limit: 2 teams x 3 does not fit in 5. The parent is the real cap,
        # and the child only stops one team from eating it alone.
        #
        # These rules deliberately do NOT set `shared: true`, and that costs
        # something. This policy targets the Gateway and each Route keeps its
        # own counters, so with two inference routes (kserve-mock and the
        # generated kserve-mock-ai) a tenant gets one budget per route --
        # twice the ceiling. `shared: true` is the setting that fixes exactly
        # that, and it was set here until a live run showed what it costs
        # instead.
        #
        # Setting it on any rule in this policy makes Envoy Gateway emit a
        # second global rate limit filter with its own domain
        # (ai-demo/ai-gateway/http alongside ai-demo/kserve-mock). Both
        # filters sit at stage 0 and evaluate the same route-level actions,
        # but the limit service registers every limit under one domain only.
        # Request-phase limits survive that, because the decision is the OR of
        # the two filters and the filter that owns the limits still rejects.
        # The token budget below does not: it is charged with
        # `apply_on_stream_done`, that call lands on the domain with no limits
        # registered, and the budget silently stops being enforced. Measured
        # on a live cluster: 8 requests x 57 tokens against a 100/minute cap,
        # no 429, while the request-count rules above kept working.
        #
        # So the choice is a tenant ceiling that doubles across two routes, or
        # a token budget that is quietly not enforced at all. The doubling is
        # the one the comparison can see -- the tenant_route_scope row reports
        # "SEPARATE bucket per route -- ceiling doubled" -- so it is the one
        # taken here. scripts/validate-tenant-model.py holds the flag off for
        # as long as this policy also carries a response-cost rule.
        - clientSelectors:
            - headers:
                - name: x-tenant-probe
                  type: Distinct
                - name: x-org-id
                  type: Distinct
          limit:
            requests: 5
            unit: Hour
        - clientSelectors:
            - headers:
                - name: x-tenant-probe
                  type: Distinct
                - name: x-org-id
                  type: Distinct
                - name: x-team-id
                  type: Distinct
          limit:
            requests: 3
            unit: Hour
        # Token budget. The request itself costs nothing; the response is
        # charged the total token count the AI Gateway extracted, so a big
        # model spends the budget four times faster than a small one.
        - clientSelectors:
            - headers:
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 100
            unit: Minute
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_total_token

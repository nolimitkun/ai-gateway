# Keycloak authenticates the caller; the scalar `tier` claim is the only
# model-authorization notion. Ordered rules implement the ceiling
# big >= medium >= small against BBR's trusted resolved-model header.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: kserve-mock, namespace: ai-demo}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: kserve-mock}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: kserve-mock-ai}
  jwt:
    providers:
      - name: keycloak
        issuer: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway
        audiences: [ai-gateway]
        remoteJWKS:
          uri: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway/protocol/openid-connect/certs
          cacheDuration: 5m
        claimToHeaders:
          - {claim: preferred_username, header: x-user-id}
          - {claim: tier, header: x-auth-tier}
          - {claim: org, header: x-org-id}
          - {claim: team, header: x-team-id}
  authorization:
    defaultAction: Deny
    rules:
      - name: big-tier
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - {name: tier, valueType: String, values: [big]}
          headers:
            - {name: x-gateway-model-name, values: [kimi-k3, glm-5.3, deepseek-v4-pro]}
      - name: deny-big-tier
        action: Deny
        principal:
          headers:
            - {name: x-gateway-model-name, values: [kimi-k3, glm-5.3, deepseek-v4-pro]}
      - name: medium-tier
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - {name: tier, valueType: String, values: [big, medium]}
          headers:
            - {name: x-gateway-model-name, values: [deepseek-v4-flash]}
      - name: deny-medium-tier
        action: Deny
        principal:
          headers:
            - {name: x-gateway-model-name, values: [deepseek-v4-flash]}
      - name: small-tier
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - {name: tier, valueType: String, values: [big, medium, small]}
  cors:
    allowOrigins: ["https://console.example.com"]
    allowMethods: [GET, POST, OPTIONS]
    allowHeaders: [authorization, content-type]

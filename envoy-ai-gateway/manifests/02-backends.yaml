# Two layers are required here, and the extra one is a real difference from
# agentgateway:
#
#   Backend (gateway.envoyproxy.io)  -- Envoy Gateway's own upstream type.
#     ^ AIServiceBackend rejects a plain core/v1 Service backendRef in v1.0.0
#       (envoyproxy/ai-gateway#902), so every upstream needs this wrapper.
#   AIServiceBackend (aigateway.envoyproxy.io) -- adds the API schema the
#     upstream speaks, which is what drives provider translation.
#
# agentgateway collapses both into one AgentgatewayModel that points straight
# at a Service.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: mock-alpha
  namespace: ai-demo
spec:
  endpoints:
    - fqdn:
        hostname: mock-llm-alpha.ai-demo.svc.cluster.local
        port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: mock-beta
  namespace: ai-demo
spec:
  endpoints:
    - fqdn:
        hostname: mock-llm-beta.ai-demo.svc.cluster.local
        port: 80
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: mock-alpha
  namespace: ai-demo
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: mock-alpha
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: mock-beta
  namespace: ai-demo
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: mock-beta

# Priority failover is health-based, not per-request: a single 503 from the
# primary does NOT move traffic to the lower-priority backend on its own.
# `numAttemptsPerPriority` is what makes Envoy try the next priority level
# within the same request.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: retry-failover
  namespace: ai-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  retry:
    numRetries: 2
    numAttemptsPerPriority: 1     # one shot per priority, then fall through
    retryOn:
      httpStatusCodes: [503]
      triggers: ["5xx", "reset", "connect-failure"]
    perRetry:
      timeout: 10s

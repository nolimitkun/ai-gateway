# MCPRoute aggregates several MCP servers behind one endpoint. Each backendRef
# names an upstream MCP server and the path it serves; the gateway multiplexes
# tools/list across all of them.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp
  namespace: ai-demo
spec:
  parentRefs:
    - name: ai-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  path: /mcp
  backendRefs:
    - name: mcp-clock
      kind: Service
      group: ""
      port: 80
      path: /mcp
    - name: mcp-math
      kind: Service
      group: ""
      port: 80
      path: /mcp

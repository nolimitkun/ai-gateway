# Envoy Gateway authentication and authorization for the KServe route.
#
# The policy targets the route rather than the Gateway so that Keycloak's own
# /realms endpoints, which share the Gateway, stay reachable without a token.
#
# claimToHeaders turns the verified identity into request headers, which is
# how the rate limit and quota buckets below get a per-user key: Envoy's rate
# limit descriptors match on headers, not on claims.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kserve-mock
  namespace: ai-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kserve-mock
  jwt:
    providers:
      - name: keycloak
        issuer: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway
        audiences:
          - ai-gateway
        remoteJWKS:
          uri: http://keycloak.ai-demo.svc.cluster.local:8080/realms/ai-gateway/protocol/openid-connect/certs
          cacheDuration: 5m
        claimToHeaders:
          - claim: preferred_username
            header: x-user-id
          - claim: plan
            header: x-auth-plan
  authorization:
    defaultAction: Deny
    rules:
      - name: admins-reach-every-model-class
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: groups
                valueType: StringArray
                values:
                  - platform-admins
      - name: big-tier-is-admin-only
        action: Deny
        principal:
          headers:
            - name: x-model-class
              values:
                - b300
      - name: model-users
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: groups
                valueType: StringArray
                values:
                  - model-users
  cors:
    allowOrigins:
      - "https://console.example.com"
    allowMethods:
      - GET
      - POST
      - OPTIONS
    allowHeaders:
      - authorization
      - content-type
      - x-model-class
